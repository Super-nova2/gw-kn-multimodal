name: bns_test_am
source: bns
split: test
paths:
  run_dir: ${REPO_ROOT}/kn_simulation/runs_am/bns_test_am
  skymap_dir: ${BASE_DIR}/GWSamplegen/outputs/production_am_bayestar/bns_test_seed_1234/skymaps
  opsim_db: ${BASE_DIR}/data/rubin_sim/baseline_v5.1/baseline_v5.1.1_10yrs.db
  sndata_root: ${BASE_DIR}/SNANA/SNDATA_ROOT
  snana_bin_dir: ${BASE_DIR}/SNANA/SNANA/bin
  log_dir: ${BASE_DIR}/logs/kn_simulation_am/bns_test_am
catalog:
  seed: 1234
  mjd_min: 61000.0
  mjd_max: 64500.0
snana:
  sim_name: LSST_KN_BNS_TEST_AM
  template_input: ${REPO_ROOT}/kn_simulation/templates/bns.input
  too_config: ${REPO_ROOT}/kn_simulation/config/rubin_too_2024.yaml
  coordinate_mode: posterior_test
  samples_per_event: 64
  sampling_nside: 256
  credible_level: 0.9
  cosmology: Planck15
slurm:
  batch_size: 20
  max_concurrency: 50
  time_limit: "04:00:00"
  cpus_per_task: 1
  memory: 10G
  finalizer_time_limit: "01:00:00"
  finalizer_memory: 4G
